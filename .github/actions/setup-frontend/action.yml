name: 'Setup Frontend'
description: 'Install pnpm, Node.js, and frontend dependencies (reuses pnpm cache).'

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
