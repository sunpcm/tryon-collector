name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type-check
        working-directory: frontend
        run: pnpm type-check
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: pnpm test:run
      - name: Build
        working-directory: frontend
        run: pnpm build

  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'
      - name: Sync deps
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Ruff
        working-directory: backend
        run: uv run ruff check .
      - name: Pytest
        working-directory: backend
        run: uv run pytest

  e2e:
    name: E2E · ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Resolve Playwright version
        working-directory: frontend
        run: echo "PLAYWRIGHT_VERSION=$(node -p 'require(\"@playwright/test/package.json\").version')" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Install system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps ${{ matrix.project }}

      - name: Run Playwright
        working-directory: frontend
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
